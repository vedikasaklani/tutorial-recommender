<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; padding: 12px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 2px; }
  input { width: 100%; padding: 6px; font-size: 13px; margin-bottom: 10px; box-sizing: border-box; }
  button { width: 100%; padding: 8px; font-size: 14px; }
  #status { color: #666; font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .rec { margin: 10px 0; }
  .rec a { font-weight: 600; text-decoration: none; }
  .rec p { margin: 2px 0 0; font-size: 12px; color: #555; }
</style>
</head>
<body>
  <label for="backend">Backend URL</label>
  <input id="backend" type="text" placeholder="http://localhost:5000/recommend">
  <button id="go">Get recommendations for this PDF</button>
  <div id="status"></div>
  <div id="results"></div>
  <script src="panel.js"></script>
</body>
</html>
